<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSD Event Analyzer</title>
<style>
  :root{ --red:#C00000; --shell:#1b1f2a; --shell2:#232838; --shell-line:#333a4d;
         --nav:#e8eaf0; --nav-muted:#9aa2b5; --bg:#f4f5f8; --card:#fff; --line:#e1e4ec;
         --on:#e5322d; --off:#7b8296; --ok:#1f9d55; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","Noto Sans SC",sans-serif;
       color:#1a1a1a;background:var(--bg);}
  button{font:inherit;}
  .app{display:flex;flex-direction:column;height:100vh;}

  /* ---- dark toolbar ---- */
  .topbar{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:10px;
          background:var(--shell);color:#fff;padding:0 12px;border-bottom:1px solid var(--shell-line);}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.2px;white-space:nowrap;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--red);}
  .brand small{font-weight:500;color:var(--nav-muted);letter-spacing:.3px;}
  .spacer{margin-left:auto;}
  #status{color:var(--nav-muted);font-size:12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw;}
  .seg{display:inline-flex;background:var(--shell2);border:1px solid var(--shell-line);border-radius:8px;overflow:hidden;flex:0 0 auto;}
  .seg button{all:unset;cursor:pointer;padding:5px 10px;font-size:12.5px;color:var(--nav-muted);}
  .seg button.on{background:#fff;color:var(--red);font-weight:700;}
  .tbtn{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;white-space:nowrap;
        background:var(--shell2);border:1px solid var(--shell-line);color:#fff;}
  .tbtn:hover{background:#2c3346;}
  .tbtn.primary{background:var(--red);border-color:var(--red);}
  .tbtn.primary:hover{filter:brightness(1.08);}

  /* ---- edit view ---- */
  .edit{flex:1;display:flex;min-height:0;}
  .stageCol{flex:1;display:flex;flex-direction:column;min-width:0;background:#0f1218;}
  .stageBox{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .stage{position:relative;background:#000;}
  .stage video{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none;}
  .dropHint{color:#aab2c5;text-align:center;font-size:14px;line-height:1.7;padding:30px;border:2px dashed #39405a;border-radius:14px;max-width:560px;}
  .dropHint b{color:#fff;}
  .stageBox.dragover .dropHint{border-color:var(--red);color:#fff;}

  .controls{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--shell);color:#fff;border-top:1px solid var(--shell-line);flex-wrap:wrap;}
  .cbtn{all:unset;cursor:pointer;padding:4px 9px;border-radius:6px;background:var(--shell2);border:1px solid var(--shell-line);font-size:12px;white-space:nowrap;}
  .cbtn:hover{background:#2c3346;}
  .cbtn:disabled{opacity:.35;cursor:default;}
  #scrub{flex:1;min-width:160px;accent-color:var(--red);}
  #timeLbl{font:12px/1 ui-monospace,Consolas,monospace;color:#dfe3ee;white-space:nowrap;min-width:190px;text-align:right;}
  .fpsBox{display:flex;align-items:center;gap:5px;color:var(--nav-muted);font-size:12px;}
  .fpsBox input{width:62px;background:var(--shell2);color:#fff;border:1px solid var(--shell-line);border-radius:5px;padding:3px 5px;font:inherit;}

  .meters{flex:0 0 auto;display:flex;gap:18px;padding:8px 12px;background:#161a24;color:#dfe3ee;border-top:1px solid var(--shell-line);flex-wrap:wrap;}
  .meter{display:flex;align-items:center;gap:8px;flex:1;min-width:280px;}
  .meter .mLbl{width:78px;font-weight:600;}
  .lampDot{width:16px;height:16px;border-radius:50%;background:#555b6b;border:1px solid #000;flex:0 0 16px;}
  .lampDot.on{background:var(--on);box-shadow:0 0 8px var(--on);}
  .bar{position:relative;flex:1;height:12px;background:#2a3040;border-radius:6px;overflow:hidden;min-width:80px;}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#7b8296;}
  .bar .fill.on{background:var(--on);}
  .bar .thr{position:absolute;top:-2px;bottom:-2px;width:2px;background:#ffd84d;left:20%;}
  .meter .mVal{font:12px ui-monospace,Consolas,monospace;width:52px;text-align:right;}
  .meter .mState{font-weight:700;width:40px;text-align:center;font-size:11.5px;border-radius:4px;padding:1px 0;background:#2a3040;}
  .meter .mState.on{background:var(--on);color:#fff;}

  .side{flex:0 0 380px;overflow-y:auto;border-left:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:10px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .card h3{margin:0 0 6px;font-size:13px;}
  .hint{color:#6b7286;font-size:11.5px;margin:0 0 8px;}
  .roiRow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;border:1px solid transparent;cursor:pointer;}
  .roiRow:hover{background:#f4f6fb;}
  .roiRow.sel{border-color:#c9cfdd;background:#eef1f8;}
  .roiRow .sw{width:10px;height:30px;border-radius:3px;flex:0 0 10px;}
  .roiRow .nm{flex:1;min-width:0;overflow:hidden;white-space:nowrap;}
  .roiRow .nm b{font:600 11.5px ui-monospace,Consolas,monospace;}
  .roiRow .nm div{color:#6b7286;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .badge{font-size:10px;padding:0 5px;border-radius:4px;background:#eceff5;color:#6b7286;margin-left:4px;font-weight:600;}
  .badge.req{background:#fde8e8;color:var(--red);}
  .badge.done{background:#e3f5ea;color:var(--ok);}
  .roiRow canvas{width:96px;height:40px;background:#0f1218;border-radius:4px;flex:0 0 96px;object-fit:contain;}
  .sbtn{all:unset;cursor:pointer;padding:3px 8px;border-radius:6px;border:1px solid #cfd4e0;background:#fff;font-size:11.5px;white-space:nowrap;}
  .sbtn:hover{background:#f0f2f7;}
  .sbtn.armed{background:var(--red);color:#fff;border-color:var(--red);}
  .sbtn.pri{background:var(--shell);color:#fff;border-color:var(--shell);}
  .calib{border-top:1px solid var(--line);padding:8px 0 4px;}
  .calib:first-of-type{border-top:0;}
  .calibHead{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px;}
  .calibHead .calScore{margin-left:auto;font:12px ui-monospace,Consolas,monospace;color:#444;}
  .crow{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap;}
  .crow .v{font:12px ui-monospace,Consolas,monospace;min-width:46px;color:#333;}
  .crow input[type=range]{flex:1;accent-color:var(--red);}
  .crow input[type=number]{width:70px;padding:2px 4px;border:1px solid #cfd4e0;border-radius:5px;font:12px ui-monospace,Consolas,monospace;}
  .grid2{display:grid;grid-template-columns:1fr 80px;gap:4px 8px;align-items:center;}
  .grid2 input{padding:2px 4px;border:1px solid #cfd4e0;border-radius:5px;font:12px ui-monospace,Consolas,monospace;width:80px;}
  kbd{font:11px ui-monospace,Consolas,monospace;background:#eceff5;border:1px solid #cfd4e0;border-bottom-width:2px;border-radius:4px;padding:0 4px;}

  .meter[data-side="A"] .lampDot.on{background:#2fd158;box-shadow:0 0 8px #2fd158;}
  .meter[data-side="A"] .bar .fill.on{background:#2fd158;}
  .meter[data-side="A"] .mState.on{background:#1f9d55;}
  .calib[data-side="A"] .lampDot.on{background:#2fd158;box-shadow:0 0 8px #2fd158;}
  .zcal{border-top:1px solid var(--line);padding:8px 0 4px;}
  .zcal:first-of-type{border-top:0;}
  .lampDot.zdot.on,.meter.zm .lampDot.on{background:#4da3ff;box-shadow:0 0 8px #4da3ff;}
  .meter.zm .bar .fill.on{background:#4da3ff;}
  .meter.zm .mState.on{background:#2563eb;}
  .offTag{font:700 9.5px -apple-system,"Segoe UI",sans-serif;color:#fff;background:#111827;border-radius:3px;padding:0 4px;margin-left:5px;vertical-align:1px;}
  .autoTag{font-size:10.5px;color:#2563eb;font-style:italic;margin-left:4px;}

  /* ---- strip chart ---- */
  .chartBox{flex:0 0 130px;position:relative;background:#0f1218;border-top:1px solid var(--shell-line);}
  .chartBox canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;}
  .chartLegend{position:absolute;right:8px;top:4px;font-size:11px;color:#9aa2b5;pointer-events:none;display:flex;gap:10px;}
  .chartLegend i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle;}

  /* ---- scan + events ---- */
  .segL{display:inline-flex;border:1px solid #cfd4e0;border-radius:7px;overflow:hidden;}
  .segL button{all:unset;cursor:pointer;padding:3px 10px;font-size:12px;color:#555;}
  .segL button.on{background:var(--shell);color:#fff;}
  .grid2 select{padding:2px 4px;border:1px solid #cfd4e0;border-radius:5px;font:12px ui-monospace,Consolas,monospace;width:80px;}
  .grid2 input[type=text]{width:80px;}
  .prog{height:8px;background:#e8ebf2;border-radius:4px;overflow:hidden;margin:8px 0 4px;}
  .prog div{height:100%;width:0;background:var(--red);transition:width .2s;}
  #scanInfo{font:11.5px ui-monospace,Consolas,monospace;color:#444;min-height:16px;}
  .sbtn:disabled{opacity:.4;cursor:default;}
  #evSummary{font-size:12px;color:#444;margin-bottom:6px;}
  #evList{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:7px;}
  .evRow{display:grid;grid-template-columns:30px 16px 1fr 58px auto;align-items:center;gap:6px;padding:3px 8px;font:12px ui-monospace,Consolas,monospace;cursor:pointer;border-bottom:1px solid #f0f2f6;}
  .evRow:hover{background:#f4f6fb;}
  .evRow.sel{background:#fde8e8;}
  .evRow .sd{font-weight:700;}
  .evRow .sd.L{color:#d42a24;} .evRow .sd.R{color:#d97706;}
  .evEmpty{padding:10px;color:#8a90a2;font-size:12px;}
  .chk{display:flex;align-items:center;gap:6px;margin:6px 0;}

  /* ---- review view ---- */
  .review{flex:1;display:flex;min-height:0;}
  .rvList{flex:0 0 290px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#fff;min-height:0;}
  .rvListHead{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;}
  .rvProgress{font-size:12px;color:#444;}
  #rvEvents{flex:1;overflow-y:auto;}
  .rvRow{display:grid;grid-template-columns:30px 16px 1fr auto;gap:1px 6px;padding:5px 10px;border-bottom:1px solid #f0f2f6;cursor:pointer;font:12px ui-monospace,Consolas,monospace;align-items:center;}
  .rvRow:hover{background:#f4f6fb;}
  .rvRow.sel{background:#fde8e8;}
  .rvRow .sd{font-weight:700;} .rvRow .sd.L{color:#d42a24;} .rvRow .sd.R{color:#d97706;}
  .rvRow .sub{grid-column:3/5;color:#6b7286;font-size:11px;}
  .kb{font:600 10.5px -apple-system,"Segoe UI",sans-serif;padding:1px 6px;border-radius:4px;color:#fff;white-space:nowrap;}
  .kb.none{background:#eceff5;color:#8a90a2;}
  .rvMain{flex:1;display:flex;flex-direction:column;min-width:0;background:#0f1218;color:#dfe3ee;}
  .rvHead{padding:7px 12px;background:var(--shell);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;min-height:34px;}
  .rvHead b{color:#fff;}
  .rvPlayerBox{flex:1;min-height:120px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .rvCrop{position:relative;overflow:hidden;background:#000;}
  .rvCrop video{position:absolute;max-width:none;display:block;}
  .rvTime{position:absolute;left:8px;top:6px;font:12px ui-monospace,Consolas,monospace;background:rgba(0,0,0,.65);padding:2px 7px;border-radius:4px;}
  .rvEmpty{position:absolute;color:#9aa2b5;font-size:14px;}
  .rvCtl{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--shell);flex-wrap:wrap;border-top:1px solid var(--shell-line);}
  #rvWin{flex:1;min-width:200px;height:28px;cursor:pointer;}
  .rvCtl input[type=number]{width:52px;}
  .dsel{background:var(--shell2);color:#fff;border:1px solid var(--shell-line);border-radius:5px;padding:2px 4px;font:12px ui-monospace,Consolas,monospace;}
  .rvStrip{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:6px 10px 8px;background:#161a24;flex:0 0 auto;}
  .rvStrip .th{position:relative;cursor:pointer;}
  .rvStrip canvas{width:100%;display:block;border-radius:3px;background:#000;border:2px solid transparent;aspect-ratio:16/9;}
  .rvStrip .th.ev canvas{border-color:rgba(255,77,77,.75);}
  .rvStrip .th.R.ev canvas{border-color:rgba(255,159,26,.85);}
  .rvStrip .th.pending canvas{background:repeating-linear-gradient(45deg,#1b2030 0 8px,#222839 8px 16px);}
  .rvStrip .th.pending::after{content:attr(data-loading);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7b8296;font-size:11px;pointer-events:none;}
  .rvStrip .th span{position:absolute;left:4px;bottom:4px;font:10.5px ui-monospace,Consolas,monospace;background:rgba(0,0,0,.65);padding:0 4px;border-radius:3px;}
  .rvSide{flex:0 0 330px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px;}
  .kpiBtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .kpiBtn{all:unset;cursor:pointer;border:2px solid #d5d9e4;border-radius:8px;padding:7px 8px;text-align:center;font-weight:600;font-size:12.5px;line-height:1.3;}
  .kpiBtn small{display:block;font-weight:400;font-size:10.5px;color:#6b7286;}
  .kpiBtn kbd{margin-right:4px;}
  .kpiBtn.on{color:#fff;border-color:transparent;}
  .kpiBtn.on small{color:#eef;}
  .kpiBtn.on kbd{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.4);color:#fff;}
  .kpiBtn:disabled{opacity:.4;cursor:default;}
  .measBig{font:700 18px ui-monospace,Consolas,monospace;margin-top:6px;}
  .measBig small{font:12px ui-monospace,Consolas,monospace;color:#6b7286;display:block;}
  .measBig.bad{color:var(--red);}
  .roCap{display:block;max-width:100%;background:#0f1218;border-radius:5px;margin-bottom:6px;}
  .roCap.empty{display:none;}
  .fpsIn{width:80px;padding:3px 5px;border:1px solid #cfd4e0;border-radius:5px;font:14px ui-monospace,Consolas,monospace;}
  .fpsIn.suggested{color:#8a90a2;font-style:italic;}
  #rvNote{width:100%;border:1px solid #cfd4e0;border-radius:6px;padding:5px;font:inherit;resize:vertical;}
  .roGrid{display:grid;grid-template-columns:62px 1fr;gap:6px 8px;align-items:center;font:11px ui-monospace,Consolas,monospace;color:#555;}
  .roGrid canvas{max-width:100%;background:#0f1218;border-radius:4px;}
  .offscreenVid{position:fixed;left:-20px;top:-20px;width:4px;height:4px;opacity:0;pointer-events:none;}
  .evRow .kb{font-size:9.5px;}

  .kpiBtn.sug:not(.on){border-style:dashed;border-color:#8a90a2;}
  .sugBox{margin-top:8px;padding:7px 9px;border-radius:7px;background:#f4f6fb;font-size:12px;color:#333;display:flex;gap:8px;align-items:center;}
  .sugBox:empty{display:none;}
  .sugBox canvas{flex:0 0 96px;width:96px;height:26px;}
  .sugBox b{font-weight:600;}
  .sugBox .hint{margin:2px 0 0;font-size:11px;}

  /* ---- report view ---- */
  .report{flex:1;overflow:auto;padding:18px;}
  .rpWrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
  .rpTop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
  .rpTop h3{margin:0;}
  .rpGrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(220px,1fr);gap:18px;align-items:start;}
  @media (max-width:900px){ .rpGrid{grid-template-columns:1fr;} }
  .lsel{padding:3px 5px;border:1px solid #cfd4e0;border-radius:6px;font:12px inherit;}
  .rpCopyBox{width:100%;height:90px;margin-top:6px;font:11px ui-monospace,Consolas,monospace;}
  .rpTableWrap{overflow-x:auto;}
  .rpTable{border-collapse:collapse;width:100%;font-size:12px;}
  .rpTable th{background:#eef1f7;text-align:left;padding:5px 8px;font-weight:600;white-space:nowrap;border-bottom:1px solid #d5d9e4;position:sticky;top:0;}
  .rpTable td{padding:4px 8px;border-bottom:1px solid #eef0f5;white-space:nowrap;}
  .rpTable td.num{text-align:right;font-family:ui-monospace,Consolas,monospace;}
  .rpTable td.note{white-space:normal;min-width:160px;}
  .rpTable tbody tr{cursor:pointer;}
  .rpTable tbody tr:hover{background:#f4f6fb;}
  .rpTable tfoot td{font-weight:700;border-top:1px solid #d5d9e4;}
  /* summary chart colours: categorical slots 1-2 (blue, orange), validated light + dark */
  .viz-root{--surface-1:#fcfcfb;--text-primary:#0b0b0b;--text-secondary:#52514e;--grid:#e6e5e0;--series-1:#2a78d6;--series-2:#eb6834;}
  .viz-root svg{display:block;width:100%;height:auto;}

  /* ---- modal / toast ---- */
  .modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;}
  .modalOverlay[hidden]{display:none;}
  .modal{background:#fff;border-radius:12px;max-width:640px;width:calc(100vw - 32px);box-shadow:0 10px 40px rgba(0,0,0,.35);overflow:hidden;}
  .modal h3{margin:0;padding:12px 16px;background:var(--shell);color:#fff;font-size:14px;}
  .modal .mb{padding:14px 16px;line-height:1.6;white-space:normal;}
  .modal pre{background:#0f1218;color:#e7ebf5;padding:8px 10px;border-radius:7px;margin:4px 0 10px;overflow-x:auto;font:12px ui-monospace,Consolas,monospace;display:flex;justify-content:space-between;gap:10px;align-items:center;}
  .modal pre button{all:unset;cursor:pointer;color:#9aa2b5;font:11px sans-serif;border:1px solid #39405a;border-radius:5px;padding:1px 7px;}
  .modal .btns{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line);}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--shell);color:#fff;padding:8px 16px;border-radius:8px;
         box-shadow:0 4px 18px rgba(0,0,0,.3);font-size:13px;z-index:1100;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;}
  #toast.show{opacity:1;}
  #toast.warn{background:#a8321f;}
  body.scanning .controls, body.scanning #overlay, body.scanning .calib, body.scanning .zcal, body.scanning #roiList{pointer-events:none;opacity:.55;}
  [hidden]{display:none !important;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>BSD Event Analyzer <small data-i18n="appSub"></small></div>
    <button class="tbtn primary" id="btnOpen" data-i18n="openVideo"></button>
    <input type="file" id="fileVideo" accept="video/*,.mkv,.mp4,.mov,.webm,.m4v,.avi" hidden>
    <div class="seg" id="viewSeg">
      <button data-view="edit" data-i18n="viewEdit"></button><button data-view="review" data-i18n="viewReview"></button><button data-view="report" data-i18n="viewReport"></button>
    </div>
    <button class="tbtn" id="btnSaveSession" data-i18n="saveSession"></button>
    <button class="tbtn" id="btnLoadSession" data-i18n="loadSession"></button>
    <input type="file" id="fileSession" accept=".json,application/json" hidden>
    <span class="spacer"></span>
    <span id="status"></span>
    <div class="seg" id="langSeg">
      <button data-lang="en">EN</button><button data-lang="zhs">简体</button><button data-lang="zht">繁體</button>
    </div>
  </header>

  <!-- ================= EDIT VIEW ================= -->
  <main class="edit" id="viewEdit">
    <section class="stageCol">
      <div class="stageBox" id="stageBox">
        <div class="dropHint" id="dropHint" data-i18n-html="dropHint"></div>
        <div class="stage" id="stage" hidden>
          <video id="vid" muted playsinline preload="auto"></video>
          <canvas id="overlay"></canvas>
        </div>
      </div>
      <div class="controls">
        <button class="cbtn" id="btnPlay" data-i18n="play" data-i18n-title="tipPlay"></button>
        <button class="cbtn" data-step="-1s" data-i18n="back1s" data-i18n-title="tipBack1s"></button>
        <button class="cbtn" data-step="-1f" data-i18n="back1f" data-i18n-title="tipBack1f"></button>
        <button class="cbtn" data-step="1f" data-i18n="fwd1f" data-i18n-title="tipFwd1f"></button>
        <button class="cbtn" data-step="1s" data-i18n="fwd1s" data-i18n-title="tipFwd1s"></button>
        <input type="range" id="scrub" min="0" max="1000000" step="1" value="0">

const PureLogic = (function () {
  const DEFAULT_RED = Object.freeze({ hueLo: 15, hueHi: 345, sMin: 0.45, vMin: 0.35 });

  // RGB 0..255 -> {h: 0..360, s: 0..1, v: 0..1}
  function rgbToHsv(r, g, b) {
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    const v = max / 255, s = max === 0 ? 0 : d / max;
    let h = 0;
    if (d !== 0) {
      if (max === r) h = 60 * (((g - b) / d) % 6);
      else if (max === g) h = 60 * ((b - r) / d + 2);
      else h = 60 * ((r - g) / d + 4);
      if (h < 0) h += 360;
    }
    return { h, s, v };
  }

  // Red if hue <= hueLo or hue >= hueHi, and S >= sMin, V >= vMin.
  // Grey pixels (no chroma) are never red.
  function isRedRgb(r, g, b, p) {
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    if (d === 0) return false;
    if (max / 255 < p.vMin) return false;
    if (d / max < p.sMin) return false;
    let h;
    if (max === r) h = 60 * (((g - b) / d) % 6);
    else if (max === g) h = 60 * ((b - r) / d + 2);
    else h = 60 * ((r - g) / d + 4);
    if (h < 0) h += 360;
    return h <= p.hueLo || h >= p.hueHi;
  }

  // data: RGBA byte array (ImageData.data). Returns fraction of red pixels 0..1.
  function redScore(data, p) {
    const n = data.length >> 2;
    if (!n) return 0;
    let c = 0;
    if (p.hueLo >= 0 && p.hueLo < 60 && p.hueHi > 300 && p.hueHi <= 360) {
      // Fast path (exact for this range): a red hue needs R as the max channel,
      // then hue = 60*(g-b)/d, so compare |g-b| against d scaled by the limits.
      const kLo = p.hueLo / 60, kHi = (360 - p.hueHi) / 60, vMin = p.vMin * 255, sMin = p.sMin;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        if (r < g || r < b || r < vMin) continue;

        if (d === 0 || d < sMin * r) continue;
        if (g >= b ? (g - b) <= d * kLo : (b - g) <= d * kHi) c++;
      }

      for (let i = 0; i < data.length; i += 4) {

  // ---- Detection zone: vehicle-in-zone from a per-cell road model ----

const PL = PureLogic;
const $ = id => document.getElementById(id);
const LS_KEY = 'bsdEventAnalyzer.v1';
const ROI_DEFS = [
  { key: 'LEFT_LAMP',  req: true,  color: '#ff4d4d' },
  { key: 'RIGHT_LAMP', req: true,  color: '#ff9f1a' },
  { key: 'BSD_ACTIVE', req: true,  color: '#e5e7eb' },
  { key: 'RL_CAM',     req: true,  color: '#3fa9f5' },
  { key: 'RR_CAM',     req: true,  color: '#2ecc71' },
  { key: 'SPEED',      req: false, color: '#c084fc' },
  { key: 'CLOCK',      req: false, color: '#f5d90a' },
  { key: 'RL_DIST',    req: false, color: '#22d3ee' },
  { key: 'RR_DIST',    req: false, color: '#a3e635' },
  { key: 'RL_FPS',     req: false, color: '#f472b6' },
  { key: 'RR_FPS',     req: false, color: '#fda4af' },
  { key: 'RL_ZONE',    req: false, color: '#818cf8', quad: true },
  { key: 'RR_ZONE',    req: false, color: '#34d399', quad: true }
];
const ZONE_ROI = { L: 'RL_ZONE', R: 'RR_ZONE' };
const isQuadKey = k => !!(ROI_DEFS.find(d => d.key === k) || {}).quad;
// 4-corner ROI: {x, y, w, h} is the bounding box, quad the corners (clockwise from top-left).
function quadRoi(q) { return Object.assign(PL.quadBBox(q), { quad: q }); }
function rectToQuad(r) { return [[r.x, r.y], [r.x + r.w, r.y], [r.x + r.w, r.y + r.h], [r.x, r.y + r.h]]; }
const LAMP_ROI = { L: 'LEFT_LAMP', R: 'RIGHT_LAMP', A: 'BSD_ACTIVE' };
const LAMP_SIDES = ['L', 'R', 'A'];

function defaultState() {
  return {
    lang: 'en', view: 'edit', fps: 30,
    rois: {},
    red: { ...PL.DEFAULT_RED },
    green: { ...PL.DEFAULT_GREEN },
    lamps: { L: { thr: 0.2, on: null, off: null }, R: { thr: 0.2, on: null, off: null }, A: { thr: 0.2, on: null, off: null } },
    scan: { mode: 'play', seekFps: 5, playRate: 4, gate: true, mergeGap: 0.5, minDuration: 0.3 },
    review: { pre: 4, post: 2, speed: 1, autoAdvance: true, suggest: true, filter: 'all', lastFps: { L: null, R: null } },
    report: { layout: 'compact', header: false, nameFirst: false, onlyLabeled: false, extras: true },
    zone: { dThr: 28, tauBg: 2, show: true, refine: true, mergeGap: 0.3, minDuration: 0.1, linkTol: 1,
            L: { thr: 0.2, on: null, off: null, bg0: null, n: 0 }, R: { thr: 0.2, on: null, off: null, bg0: null, n: 0 } },
    videos: {}    // per video ("name|size"): { anchor: {video, clock} | null, labels: [...] }
  };
}

// Merge untrusted settings (localStorage / session file) into a clean state.
function sanitizeSettings(src, base) {
  const s = base || defaultState();
  if (!src || typeof src !== 'object') return s;
  if (I18N[src.lang]) s.lang = src.lang;
  if (src.view === 'edit' || src.view === 'report') s.view = src.view;
  if (Number.isFinite(src.fps) && src.fps > 0 && src.fps <= 240) s.fps = src.fps;
  if (src.rois && typeof src.rois === 'object') {
    s.rois = {};
    for (const d of ROI_DEFS) {
      const v = src.rois[d.key];
      if (d.quad) {
        const q = v && (PL.cleanQuad(v.quad) || (PL.clampNormRect(v) && rectToQuad(PL.clampNormRect(v))));
        if (q) s.rois[d.key] = quadRoi(q);
      } else { const r = PL.clampNormRect(v); if (r) s.rois[d.key] = r; }
    }
  }
  if (src.red && typeof src.red === 'object') {
    for (const k of Object.keys(PL.DEFAULT_RED)) if (Number.isFinite(src.red[k])) s.red[k] = src.red[k];
  }
  if (src.green && typeof src.green === 'object') {
    for (const k of Object.keys(PL.DEFAULT_GREEN)) if (Number.isFinite(src.green[k])) s.green[k] = src.green[k];
  }
  if (src.scan && typeof src.scan === 'object') {
    const c = src.scan;
    if (c.mode === 'play' || c.mode === 'seek') s.scan.mode = c.mode;
    if (Number.isFinite(c.seekFps) && c.seekFps > 0 && c.seekFps <= 60) s.scan.seekFps = c.seekFps;
    if ([2, 4, 6, 8].includes(c.playRate)) s.scan.playRate = c.playRate;
    if (typeof c.gate === 'boolean') s.scan.gate = c.gate;
    if (Number.isFinite(c.mergeGap) && c.mergeGap >= 0) s.scan.mergeGap = c.mergeGap;
    if (Number.isFinite(c.minDuration) && c.minDuration >= 0) s.scan.minDuration = c.minDuration;
  }
  if (src.review && typeof src.review === 'object') {
    const r = src.review, d = s.review;
    if (Number.isFinite(r.pre) && r.pre >= 0 && r.pre <= 30) d.pre = r.pre;
    if (Number.isFinite(r.post) && r.post >= 0 && r.post <= 30) d.post = r.post;
    if ([0.25, 0.5, 1, 2, 4].includes(r.speed)) d.speed = r.speed;
    if (typeof r.autoAdvance === 'boolean') d.autoAdvance = r.autoAdvance;
    if (typeof r.suggest === 'boolean') d.suggest = r.suggest;
    if (['all', 'todo', 'L', 'R', 'off'].includes(r.filter)) d.filter = r.filter;
    if (r.lastFps) for (const k of ['L', 'R']) d.lastFps[k] = Number.isFinite(r.lastFps[k]) ? r.lastFps[k] : null;
  }
  if (src.zone && typeof src.zone === 'object') {
    const z = src.zone, d = s.zone, num = (x, lo, hi) => Number.isFinite(x) && x >= lo && x <= hi;
    if (num(z.dThr, 1, 255)) d.dThr = z.dThr;
    if (num(z.tauBg, 0.1, 60)) d.tauBg = z.tauBg;
    for (const k of ['show', 'refine']) if (typeof z[k] === 'boolean') d[k] = z[k];
    if (num(z.mergeGap, 0, 10)) d.mergeGap = z.mergeGap;
    if (num(z.minDuration, 0, 10)) d.minDuration = z.minDuration;
    if (num(z.linkTol, 0, 10)) d.linkTol = z.linkTol;
    for (const side of ['L', 'R']) {
      const a = z[side], b = d[side]; if (!a) continue;
      if (num(a.thr, 0, 1)) b.thr = a.thr;
      b.on = num(a.on, 0, 1) ? a.on : null; b.off = num(a.off, 0, 1) ? a.off : null;
      if (Array.isArray(a.bg0) && a.bg0.length === PL.ZONE_GW * PL.ZONE_GH * 4 && a.bg0.every(Number.isFinite)) { b.bg0 = a.bg0; b.n = Number.isFinite(a.n) ? a.n : 1; }
    }
  }
  if (src.report && typeof src.report === 'object') {
    const r = src.report, d = s.report;
    if (r.layout === 'compact' || r.layout === 'template') d.layout = r.layout;
    for (const k of ['header', 'nameFirst', 'onlyLabeled', 'extras']) if (typeof r[k] === 'boolean') d[k] = r[k];
  }
  if (src.videos && typeof src.videos === 'object') {
    for (const [k, v] of Object.entries(src.videos)) { const r = sanitizeReview(v); if (r) s.videos[k] = r; }
  }
  if (src.lamps && typeof src.lamps === 'object') {
    for (const side of LAMP_SIDES) {
      const l = src.lamps[side]; if (!l) continue;
      if (Number.isFinite(l.thr)) s.lamps[side].thr = PL.clamp(l.thr, 0, 1);
      s.lamps[side].on = Number.isFinite(l.on) ? l.on : null;
      s.lamps[side].off = Number.isFinite(l.off) ? l.off : null;
    }
  }
  return s;
}

function sanitizeReview(v) {
  if (!v || typeof v !== 'object') return null;
  const num = x => (Number.isFinite(x) ? x : null);
  const out = { anchor: null, labels: [] };
  if (v.anchor && Number.isFinite(v.anchor.video) && Number.isFinite(v.anchor.clock)) out.anchor = { video: v.anchor.video, clock: v.anchor.clock };
  if (Array.isArray(v.labels)) for (const l of v.labels) {
    if (!l || (l.side !== 'L' && l.side !== 'R') || !Number.isFinite(l.tStart) || !Number.isFinite(l.tEnd)) continue;
    out.labels.push({ side: l.side, kind: l.kind === 'off' ? 'off' : 'on', tStart: l.tStart, tEnd: l.tEnd, kpi: PL.KPI.includes(l.kpi) ? l.kpi : null,
      note: typeof l.note === 'string' ? l.note.slice(0, 2000) : '', fps: num(l.fps), markIn: num(l.markIn), markOut: num(l.markOut) });
  }
  return out;
}

function loadLocal() {
  try { return sanitizeSettings(JSON.parse(localStorage.getItem(LS_KEY) || 'null')); }

const vid = $('vid');
const overlay = $('overlay');
const octx = overlay.getContext('2d');
const sampleCanvas = document.createElement('canvas');
const sctx = sampleCanvas.getContext('2d', { willReadFrequently: true });
let loadTimer = null;

function openVideoFile(f) {
  if (!f) return;
  if (V.url) URL.revokeObjectURL(V.url);
  V.file = f; V.url = URL.createObjectURL(f); V.meta = null; V.ready = false; V.pendingSeek = null;
  V.scores = { L: null, R: null, A: null };
  V.samples = []; V.events = []; V.selEvent = null; V.dirty = false; V.refined = []; V.zoneEvents = [];
  $('stage').hidden = true; $('dropHint').hidden = false;

  RV.sel = null; RV.win = null; RV.token++; RV.cache.clear(); V.labelMap = [];
  clearTimeout(loadTimer);

}

vid.addEventListener('loadedmetadata', () => {
  if (!V.file) return;
  clearTimeout(loadTimer);
  if (!vid.videoWidth || !vid.videoHeight) { showCodecHelp('no decodable video track'); return; }
  V.ready = true;
  V.meta = PL.sessionKey(V.file.name, V.file.size, vid.duration);
  $('dropHint').hidden = true; $('stage').hidden = false;
  layoutStage(); updateStatus(); updateTimeUI();
  if (!Number.isFinite(vid.duration) || vid.duration <= 0) {
    const n = V.file.name, base = n.replace(/\.[^.]+$/, '');

  }

    const mm = PL.sessionKeyMismatch(V.expectKey, V.meta);

    V.expectKey = null;
  }
  if (V.pendingSamples) { V.samples = V.pendingSamples; V.pendingSamples = null; }
  extractNow();

  else toast(t('msgNoRvfc'), true);
});

vid.addEventListener('error', () => {
  if (!V.file) return;
  clearTimeout(loadTimer);
  const e = vid.error;
  const names = { 1: 'aborted', 2: 'network/read error', 3: 'decode error', 4: 'format or codec not supported' };
  showCodecHelp(e ? `MediaError ${e.code}: ${names[e.code] || ''} ${e.message || ''}`.trim() : 'unknown error');

function onVideoFrame() {
  scheduleRefresh();
  vid.requestVideoFrameCallback(onVideoFrame);
}
vid.addEventListener('seeked', () => {
  if (V.pendingSeek != null) { const p = V.pendingSeek; V.pendingSeek = null; vid.currentTime = p; }
  scheduleRefresh();
});
vid.addEventListener('timeupdate', updateTimeUI);
vid.addEventListener('play', updatePlayBtn);
vid.addEventListener('pause', () => { updatePlayBtn(); scheduleRefresh(); });

// Coalesces rapid scrub input: only one seek in flight, latest target wins.
function requestSeek(tSec) {
  if (!V.ready) return;
  const dur = Number.isFinite(vid.duration) ? vid.duration : Infinity;
  tSec = PL.clamp(tSec, 0, dur);
  if (vid.seeking) { V.pendingSeek = tSec; return; }
  vid.currentTime = tSec;
  updateTimeUI(tSec);
}
function curTime() { return V.pendingSeek != null ? V.pendingSeek : vid.currentTime; }
function step(kind) {
  if (!V.ready) return;
  vid.pause();
  const n = parseFloat(kind);
  const dt = kind.endsWith('f') ? n / (S.fps || 30) : n;
  requestSeek(curTime() + dt);
}
function togglePlay() { if (!V.ready) return; vid.paused ? vid.play().catch(() => {}) : vid.pause(); }
function updatePlayBtn() { $('btnPlay').textContent = vid.paused ? t('play') : t('pause'); }

let scrubbing = false;
function updateTimeUI(forceT) {
  const tt = Number.isFinite(forceT) ? forceT : vid.currentTime;
  const dur = vid.duration;
  $('timeLbl').textContent = PL.fmtVideoTime(V.ready ? tt : NaN) + ' / ' + PL.fmtVideoTime(V.ready ? dur : NaN) +
    (V.ready ? `  ${t('frame')} ${Math.round(tt * S.fps)}` : '');
  if (!scrubbing && Number.isFinite(dur) && dur > 0) $('scrub').value = Math.round(tt / dur * 1e6);
}

function updateStatus(override) {
  const el = $('status');
  if (override) { el.textContent = override; return; }
  if (!V.ready || !V.file) { el.textContent = V.file ? '' : t('statusNoVideo'); return; }
  const gb = V.file.size / 1073741824;
  const sz = gb >= 1 ? gb.toFixed(2) + ' GB' : (V.file.size / 1048576).toFixed(0) + ' MB';
  el.textContent = `${V.file.name} · ${vid.videoWidth}×${vid.videoHeight} · ${PL.fmtVideoTime(vid.duration)} · ${sz}`;
  el.title = el.textContent;
}

function layoutStage() {
  if (!V.ready) return;
  const box = $('stageBox').getBoundingClientRect();
  const ar = vid.videoWidth / vid.videoHeight;
  let w = box.width - 16, h = w / ar;
  if (h > box.height - 16) { h = box.height - 16; w = h * ar; }
  w = Math.max(50, Math.floor(w)); h = Math.max(30, Math.floor(h));
  const st = $('stage'); st.style.width = w + 'px'; st.style.height = h + 'px';
  const dpr = window.devicePixelRatio || 1;
  overlay.width = Math.round(w * dpr); overlay.height = Math.round(h * dpr);
  drawOverlay();
}
new ResizeObserver(layoutStage).observe($('stageBox'));

async function detectFps() {
  if (!V.ready) return toast(t('msgNeedVideo'), true);
  if (!('requestVideoFrameCallback' in vid)) return toast(t('msgNoRvfc'), true);
  const t0 = vid.currentTime, times = [];
  let done = false;
  const cb = (now, md) => { times.push(md.mediaTime); if (!done && times.length < 40) vid.requestVideoFrameCallback(cb); };
  vid.requestVideoFrameCallback(cb);
  vid.playbackRate = 1;
  try { await vid.play(); } catch (e) { return toast(t('msgFpsFail'), true); }
  const start = performance.now();
  await new Promise(res => { const iv = setInterval(() => { if (times.length >= 40 || performance.now() - start > 3000) { clearInterval(iv); res(); } }, 50); });
  done = true; vid.pause(); requestSeek(t0);
  const f = PL.estimateFps(times);
  if (!f) return toast(t('msgFpsFail'), true);
  S.fps = f; $('fpsIn').value = f; scheduleSave(); updateTimeUI();
  toast(t('msgFpsDetected', { fps: f }));
}


/* =====================================================================
   LIVE LAMP SCORING + ROI THUMBNAILS
   ===================================================================== */
// Draw only the ROI region of the current frame into a small canvas and return its pixels.
function grabRoi(roi, maxDim, el) {
  el = el || vid;
  const W = el.videoWidth, H = el.videoHeight;
  if (!W || !H || !roi) return null;
  const p = PL.normToPx(roi, W, H);
  const k = Math.min(1, maxDim / Math.max(p.sw, p.sh));
  const dw = Math.max(1, Math.round(p.sw * k)), dh = Math.max(1, Math.round(p.sh * k));
  if (sampleCanvas.width !== dw || sampleCanvas.height !== dh) { sampleCanvas.width = dw; sampleCanvas.height = dh; }
  sctx.drawImage(el, p.sx, p.sy, p.sw, p.sh, 0, 0, dw, dh);
  return sctx.getImageData(0, 0, dw, dh);
}

function scoreLamp(side) {
  const img = grabRoi(S.rois[LAMP_ROI[side]], 64);
  if (!img) return null;
  return side === 'A' ? PL.greenScore(img.data, S.green) : PL.redScore(img.data, S.red);
}

let refreshQueued = false;
function scheduleRefresh() {
  if (refreshQueued) return;
  refreshQueued = true;
  requestAnimationFrame(() => { refreshQueued = false; refreshLive(); });
}
function refreshLive() {
  if (!V.ready || vid.readyState < 2) return;
  if (SCAN.running) { scheduleChart(); return; }   // the scan updates meters itself
  for (const side of LAMP_SIDES) V.scores[side] = scoreLamp(side);
  measureZonesLive();
  renderLamps(); renderZone(); updateThumbs(); updateTimeUI(); scheduleChart();
  if (zoneSides().length && S.zone.show) drawOverlay();
}

function renderLamps() {
  for (const side of LAMP_SIDES) {
    const sc = V.scores[side], thr = S.lamps[side].thr, on = PL.lampIsOn(sc, thr);
    const has = Number.isFinite(sc);
    const m = document.querySelector(`.meter[data-side="${side}"]`);
    m.querySelector('.fill').style.width = (has ? sc * 100 : 0) + '%';
    m.querySelector('.fill').classList.toggle('on', on);
    m.querySelector('.thr').style.left = `calc(${thr * 100}% - 1px)`;
    m.querySelector('.mVal').textContent = has ? sc.toFixed(3) : '—';
    const st = m.querySelector('.mState'); st.textContent = has ? (on ? t('stateOn') : t('stateOff')) : '—'; st.classList.toggle('on', on);
    m.querySelector('.lampDot').classList.toggle('on', on);
    const c = document.querySelector(`.calib[data-side="${side}"]`);

function scanUi(tNow, force) {

// Seek and resolve once the new frame is ready to be drawn.
function waitSeek(tSec) {
  return new Promise((resolve, reject) => {
    let done = false;
    const fin = () => { if (!done) { done = true; clearTimeout(guard); resolve(); } };
    const guard = setTimeout(() => { if (!done) { done = true; reject(new Error('seek timeout at ' + PL.fmtVideoTime(tSec))); } }, 30000);
    vid.addEventListener('seeked', () => {
      if ('requestVideoFrameCallback' in vid) { vid.requestVideoFrameCallback(fin); setTimeout(fin, 200); } else fin();
    }, { once: true });
    vid.currentTime = tSec;
  });
}
function waitVisible() {
  if (!document.hidden) return Promise.resolve();
  toast(t('scanHidden'), true);
  return new Promise(res => {
    const h = () => { if (!document.hidden) { document.removeEventListener('visibilitychange', h); res(); } };
    document.addEventListener('visibilitychange', h);
  });
}

// Deterministic: one seek per sample.
async function scanSeek() {
  const dt = 1 / S.scan.seekFps;
  const n = Math.floor((SCAN.to - SCAN.from) / dt + 1e-9);
  for (let i = 0; i <= n && !SCAN.cancel; i++) {
    if (document.hidden) await waitVisible();
    const tt = Math.min(SCAN.to, SCAN.from + i * dt);   // index-based: no float drift
    for (let k = 0; ; k++) {
      try { await waitSeek(tt); break; }
      catch (e) { SCAN.stalls = (SCAN.stalls || 0) + 1; if (k >= 2 || SCAN.cancel) throw new Error(t('scanStalledStop', { t: PL.fmtVideoTime(tt) })); }

    scanUi(tt);
  }
}

// Fast: play muted at N× and sample every presented frame.
// A watchdog recovers from playback stalls (decoder / renderer starving at high speed, the browser
// pausing the video by itself, a broken frame-callback chain): it jumps back to the last scanned
// frame and plays again, halves the speed when stalls repeat, and gives up with a clear message.
const STALL_MS = 3000, STALL_TRIES = 6;
async function scanPlay() {
  await waitSeek(SCAN.from);
  takeSample(SCAN.from);
  let rate = S.scan.playRate;
  SCAN.rate = rate; SCAN.stalls = 0; SCAN.sampleErrors = 0;
  await new Promise((resolve, reject) => {
    let finished = false, recovering = false, failsInRow = 0, gen = 0, lastFrameWall = performance.now();
    const finish = err => {
      if (finished) return;
      finished = true; gen++; vid.pause(); clearInterval(watch);
      vid.removeEventListener('ended', onEnd); vid.removeEventListener('error', onErr); document.removeEventListener('visibilitychange', onVis);
      err ? reject(err) : resolve();
    };
    const start = () => { if (!finished && !document.hidden) { vid.playbackRate = rate; vid.play().catch(() => {}); } };   // failures -> watchdog
    const onFrame = md => {
      if (SCAN.cancel) return finish();
      const tt = md.mediaTime;
      if (tt > SCAN.to) return finish();
      lastFrameWall = performance.now();
      if (tt > SCAN.lastT) {
        failsInRow = 0;
        try { takeSample(tt); } catch (e) { SCAN.sampleErrors++; SCAN.lastT = tt; }
        scanUi(tt);
      }
    };
    // (Re)arm the frame-callback chain; an older chain stops at its next callback.
    const arm = () => {
      const g = ++gen;
      const f = (now, md) => { if (g !== gen || finished) return; vid.requestVideoFrameCallback(f); onFrame(md); };
      vid.requestVideoFrameCallback(f);
    };
    const onEnd = () => finish();
    const onErr = () => finish(new Error(t('scanVideoError', { code: vid.error ? vid.error.code : '?', t: PL.fmtVideoTime(SCAN.lastT) })));
    const onVis = () => {
      if (document.hidden) { vid.pause(); toast(t('scanHidden'), true); }
      else { lastFrameWall = performance.now(); start(); }
    };
    const watch = setInterval(async () => {
      if (finished || recovering) return;
      if (SCAN.cancel) return finish();
      if (document.hidden) { lastFrameWall = performance.now(); return; }
      if (vid.ended) return finish();
      const idle = performance.now() - lastFrameWall;
      if (vid.paused && idle > 700) { start(); }                 // paused by the browser: just play again
      if (idle < STALL_MS) return;
      recovering = true; SCAN.stalls++; failsInRow++;
      if (failsInRow > STALL_TRIES) { recovering = false; return finish(new Error(t('scanStalledStop', { t: PL.fmtVideoTime(SCAN.lastT) }))); }
      if ((failsInRow >= 2 || SCAN.stalls % 3 === 0) && rate > 1) { rate = Math.max(1, rate / 2); SCAN.rate = rate; toast(t('scanSlowed', { r: rate }), true); }
      try { vid.pause(); await waitSeek(Math.max(SCAN.from, SCAN.lastT)); } catch (e) { /* retried next round */ }
      lastFrameWall = performance.now(); recovering = false;
      if (!finished) { arm(); start(); }
    }, 500);
    vid.addEventListener('ended', onEnd);
    vid.addEventListener('error', onErr);
    document.addEventListener('visibilitychange', onVis);
    arm();
    if (document.hidden) onVis(); else start();
  });
}

/* =====================================================================
   STRIP CHART (L / R lamp scores, BSD Active strip, events, playhead)
   ===================================================================== */
const chart = $('chart'), cctx = chart.getContext('2d');
let chartView = null;      // [t0, t1] or null = whole video
let chartDrag = null, chartQueued = false;
function scheduleChart() {
  if (chartQueued) return;
  chartQueued = true;
  requestAnimationFrame(() => { chartQueued = false; drawChart(); });
}
function chartDur() { return V.ready && Number.isFinite(vid.duration) && vid.duration > 0 ? vid.duration : 0; }
function chartRange() { const d = chartDur(); return d ? (chartView || [0, d]) : null; }
function chartSamples() {
  return SCAN.running && SCAN.buf.length ? PL.mergeSamples(V.samples, SCAN.buf, SCAN.from, SCAN.lastT) : V.samples;
}
const TICKS = [0.1, 0.2, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200];

function drawChart() {
  const dpr = window.devicePixelRatio || 1;
  const bw = Math.round(chart.clientWidth * dpr), bh = Math.round(chart.clientHeight * dpr);
  if (!bw || !bh) return;
  if (chart.width !== bw || chart.height !== bh) { chart.width = bw; chart.height = bh; }
  const W = bw, H = bh, c = cctx;
  c.clearRect(0, 0, W, H);
  const rg = chartRange();
  if (!rg) return;
  const [x0, x1] = rg, span = x1 - x0;
  const X = tt => (tt - x0) / span * W;
  const top = 18 * dpr, actH = 6 * dpr, axisH = 16 * dpr;
  const actY = H - axisH - actH, bot = actY - 3 * dpr, ph = bot - top;
  const Y = v => bot - PL.clamp(v, 0, 1) * ph;

  // bucket samples per pixel column (max keeps short spikes visible)
  const sm = chartSamples();
  const bL = new Float32Array(W).fill(-1), bR = new Float32Array(W).fill(-1), bZL = new Float32Array(W).fill(-1), bZR = new Float32Array(W).fill(-1);
  const i0 = Math.max(0, PL.lowerBound(sm, x0) - 1), i1 = Math.min(sm.length, PL.lowerBound(sm, x1) + 1);
  for (let i = i0; i < i1; i++) {
    const s = sm[i], px = Math.floor(X(s.t));
    if (px < 0 || px >= W) continue;
    if (s.L != null && s.L > bL[px]) bL[px] = s.L;
    if (s.R != null && s.R > bR[px]) bR[px] = s.R;
    if (s.ZL != null && s.ZL > bZL[px]) bZL[px] = s.ZL;
    if (s.ZR != null && s.ZR > bZR[px]) bZR[px] = s.ZR;
  }
  const gapPx = Math.max(2, 1.5 / span * W);  // break lines over unscanned gaps > 1.5 s
  const line = (b, col, dash) => {
    c.strokeStyle = col; c.lineWidth = 1.5 * dpr; c.setLineDash(dash ? [4 * dpr, 3 * dpr] : []); c.beginPath();
    let last = -1e9;
    for (let x = 0; x < W; x++) {
      if (b[x] < 0) continue;
      if (x - last > gapPx) c.moveTo(x, Y(b[x])); else c.lineTo(x, Y(b[x]));
      last = x;
    }
    c.stroke();
  };
  // scanned coverage + BSD Active strip: solid spans between consecutive samples (gaps > 1.5 s left empty)
  for (let i = i0; i < i1; i++) {
    const s = sm[i], nx = sm[i + 1];
    const a = X(s.t), b = nx && nx.t - s.t <= 1.5 ? X(nx.t) : a + 1;
    if (b < 0 || a > W) continue;
    const w = Math.max(1, b - a);
    c.fillStyle = '#151a25'; c.fillRect(a, top, w, ph);
    c.fillStyle = s.A == null ? '#262b38' : PL.lampIsOn(s.A, S.lamps.A.thr) ? '#2fd158' : '#3a4152';
    c.fillRect(a, actY, w, actH);
  }
  // time grid
  const step = TICKS.find(s => span / s <= W / (110 * dpr)) || 7200;
  c.font = `${10 * dpr}px ui-monospace,Consolas,monospace`; c.textBaseline = 'top';
  for (let tt = Math.ceil(x0 / step) * step; tt <= x1; tt += step) {
    const x = Math.round(X(tt)) + 0.5;
    c.fillStyle = '#1d2230'; c.fillRect(x, top, 1, bot - top);
    c.fillStyle = '#7b8296';
    const lbl = step < 1 ? PL.fmtVideoTime(tt) : fmtDur(tt);
    c.fillText(lbl, Math.min(x + 3 * dpr, W - c.measureText(lbl).width - 2), H - axisH + 3 * dpr);
  }

  // events
  for (const e of V.events) {
    if (e.tEnd < x0 || e.tStart > x1) continue;
    const a = X(e.tStart), w = Math.max(2 * dpr, X(e.tEnd) - a), sel = e.id === V.selEvent;
    if (e.kind === 'off') {      // vehicle in zone, lamp never on: outlined band
      c.strokeStyle = e.side === 'L' ? '#818cf8' : '#34d399'; c.lineWidth = (sel ? 2.5 : 1.5) * dpr;
      c.setLineDash([3 * dpr, 2 * dpr]); c.strokeRect(a, top + 1, w, ph - 2); c.setLineDash([]);
      continue;
    }
    c.fillStyle = e.side === 'L' ? (sel ? 'rgba(255,77,77,.45)' : 'rgba(255,77,77,.2)') : (sel ? 'rgba(255,159,26,.45)' : 'rgba(255,159,26,.2)');
    c.fillRect(a, top, w, ph);
  }

  line(bZL, '#818cf8', true); line(bZR, '#34d399', true); c.setLineDash([]);
  line(bL, '#ff4d4d'); line(bR, '#ff9f1a');

  // thresholds
  c.setLineDash([4 * dpr, 4 * dpr]); c.lineWidth = 1 * dpr;
  for (const [side, col] of [['L', '#ff4d4d'], ['R', '#ff9f1a']]) {
    const y = Math.round(Y(S.lamps[side].thr)) + 0.5;
    c.strokeStyle = col; c.globalAlpha = 0.6; c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke();
  }
  c.globalAlpha = 1; c.setLineDash([]);

  // scan cursor + playhead
  if (SCAN.running && Number.isFinite(SCAN.lastT)) { c.fillStyle = '#C00000'; c.fillRect(Math.round(X(SCAN.lastT)), top, 2 * dpr, ph + actH + 3 * dpr); }
  else if (V.ready) { const x = Math.round(X(curTime())); c.fillStyle = '#ffffff'; c.fillRect(x, top - 4 * dpr, 1 * dpr, ph + actH + 7 * dpr); }
}

function chartTimeAt(clientX) {

// Grouped horizontal bars: KPI type x side. One axis, values at bar ends, <title> tooltips.
function summarySvg(counts) {
  const cats = PL.KPI.concat(['none']);
  const max = Math.max(1, ...cats.map(k => Math.max(counts[k].L, counts[k].R)));
  const step = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000].find(s => max / s <= 5) || 1000;
  const axisMax = Math.ceil(max / step) * step;
  const W = 560, labelW = 150, valW = 36, top = 34, rowH = 44, barH = 14, gap = 2;
  const plotW = W - labelW - valW, H = top + cats.length * rowH + 20;
  const X = v => labelW + v / axisMax * plotW;
  const bar = (x0, y, w, h) => {      // flat at the baseline, 4 px rounded data end
    if (w <= 0) return '';
    const r = Math.min(4, w / 2, h / 2);
    return `M${x0},${y}h${w - r}a${r},${r} 0 0 1 ${r},${r}v${h - 2 * r}a${r},${r} 0 0 1 -${r},${r}h-${w - r}z`;
  };
  let o = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('rpChartAria'))}" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,'Noto Sans TC','Noto Sans SC',sans-serif">`;
  // legend
  o += `<rect x="${labelW}" y="6" width="12" height="12" rx="3" style="fill:var(--series-1)"/><text x="${labelW + 18}" y="16" font-size="12" style="fill:var(--text-secondary)">${esc(t('rpLegendL'))}</text>`;
  o += `<rect x="${labelW + 150}" y="6" width="12" height="12" rx="3" style="fill:var(--series-2)"/><text x="${labelW + 168}" y="16" font-size="12" style="fill:var(--text-secondary)">${esc(t('rpLegendR'))}</text>`;
  // grid + ticks
  for (let v = 0; v <= axisMax; v += step) {
    const x = X(v).toFixed(1);
    o += `<line x1="${x}" x2="${x}" y1="${top - 4}" y2="${H - 18}" style="stroke:var(--grid)" stroke-width="1"/>`;
    o += `<text x="${x}" y="${H - 4}" font-size="10.5" text-anchor="middle" style="fill:var(--text-secondary)">${v}</text>`;
  }
  cats.forEach((k, i) => {
    const y0 = top + i * rowH + 6;
    o += `<text x="${labelW - 10}" y="${y0 + barH + 5}" font-size="12.5" text-anchor="end" style="fill:var(--text-primary)">${esc(t('kpi_' + k))}</text>`;
    [['L', 'var(--series-1)', 0], ['R', 'var(--series-2)', 1]].forEach(([side, col, j]) => {
      const v = counts[k][side], y = y0 + j * (barH + gap), w = X(v) - X(0);
      o += `<g><title>${esc(t('kpi_' + k))} · ${side}: ${v}</title>`;
      o += `<rect x="${labelW}" y="${y}" width="${plotW + valW}" height="${barH}" fill="transparent"/>`;
      if (v > 0) o += `<path d="${bar(X(0), y, w, barH)}" style="fill:${col}"/>`;
      if (v > 0) o += `<text x="${(X(v) + 5).toFixed(1)}" y="${y + barH - 3}" font-size="11" style="fill:var(--text-secondary)">${v}</text>`;
      o += '</g>';
    });
  });
  return o + '</svg>';
}
function onOffCounts(rows) {

function countsTable(counts, onoff) {

async function eventThumb(ev, lab) {
  const tt = lab && Number.isFinite(lab.markIn) && Number.isFinite(lab.markOut) ? (lab.markIn + lab.markOut) / 2 : (ev.tStart + ev.tEnd) / 2;
  const cv = await fvGrab(tt, () => captureRoi(fvid, S.rois[CAM_ROI[ev.side]] || FULL_ROI, 320));
  if (!cv) return '';
  let out = cv;
  if (cv.width !== 320) {          // normalise to 320 px wide
    out = document.createElement('canvas');
    out.width = 320; out.height = Math.max(1, Math.round(cv.height * 320 / cv.width));
    const c = out.getContext('2d'); c.imageSmoothingQuality = 'high'; c.drawImage(cv, 0, 0, out.width, out.height);
  }
  return out.toDataURL('image/jpeg', 0.8);
}

/* =====================================================================
   SAVE CLIP (lossless MKV cut, built from slices of the original file)
   ===================================================================== */
const CLIP = { running: false };
function downloadBlob(name, blob) {
  const a = document.createElement('a'), url = URL.createObjectURL(blob);
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 120000);
}
async function saveClip(from, to) {
  if (!V.ready) return toast(t('msgNeedVideo'), true);
  if (CLIP.running) return;
  const dur = vid.duration;
  from = PL.clamp(from, 0, Number.isFinite(dur) ? dur : from);
  if (!(to > from)) return toast(t('scanBadRange'), true);
  CLIP.running = true; $('btnClip').disabled = $('rvClip').disabled = true;
  $('clipInfo').textContent = t('clipWorking');
  try {
    const raw = (off, len) => V.file.slice(off, off + len).arrayBuffer().then(b => new Uint8Array(b));
    const plan = await PL.mkvClipPlan(PL.cachedReader(raw), V.file.size, from, to);
    const blob = new Blob(plan.parts.map(p => (p.bytes ? p.bytes : V.file.slice(p.src[0], p.src[1]))), { type: 'video/x-matroska' });
    const tag = x => PL.fmtVideoTime(x).replace(/:/g, '-').replace(/\.\d+$/, '');
    downloadBlob(`${baseName()}_clip_${tag(plan.startSec)}_${tag(plan.endSec)}.mkv`, blob);
    const mb = (plan.size / 1048576).toFixed(1) + ' MB';
    $('clipInfo').textContent = t('clipSaved', { from: PL.fmtVideoTime(plan.startSec), to: PL.fmtVideoTime(plan.endSec), size: mb });
    toast($('clipInfo').textContent);
  } catch (e) {
    const msg = e && e.message ? e.message : String(e);
    $('clipInfo').textContent = t('clipFailed', { why: msg });
    if (/not a Matroska/.test(msg)) {
      const n = V.file.name, base = n.replace(/\.[^.]+$/, '');
      showModal(t('clipTitle'), esc(t('clipNotMkv')) + cmdBlock(`ffmpeg -ss ${from.toFixed(2)} -i "${n}" -t ${(to - from).toFixed(2)} -c copy "${base}_clip.mkv"`));
    } else toast(t('clipFailed', { why: msg }), true);
  } finally {
    CLIP.running = false; $('btnClip').disabled = $('rvClip').disabled = false;
  }
}

async function loadSessionText(text) {

  }
  const keep = { lang: S.lang, view: S.view, videos: S.videos };

  const rv = sanitizeReview(d.review);
  const rkey = V.meta ? vkey() : d.video ? d.video.name + '|' + d.video.size : null;
  if (rv && rkey) S.videos[rkey] = rv;

    .map(r => ({ side: r.side, tStart: r.tStart, tEnd: r.tEnd, inT: r.inT, outT: r.outT, exact: !!r.exact })) : [];

}

$('btnLoadSession').onclick = () => $('fileSession').click();
$('fileSession').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) f.text().then(loadSessionText); };
document.querySelectorAll('#langSeg button').forEach(b => b.onclick = () => { S.lang = b.dataset.lang; applyI18n(); scheduleSave(); });
document.querySelectorAll('#viewSeg button').forEach(b => b.onclick = () => setView(b.dataset.view));
$('btnPlay').onclick = togglePlay;
document.querySelectorAll('[data-step]').forEach(b => b.onclick = () => step(b.dataset.step));
$('btnDetectFps').onclick = detectFps;
$('fpsIn').value = S.fps;
$('fpsIn').onchange = e => { const f = parseFloat(e.target.value); if (f > 0 && f <= 240) { S.fps = f; scheduleSave(); updateTimeUI(); } else e.target.value = S.fps; };

const scrub = $('scrub');
scrub.addEventListener('pointerdown', () => { scrubbing = true; vid.pause(); });
scrub.addEventListener('input', () => { if (Number.isFinite(vid.duration)) requestSeek(scrub.value / 1e6 * vid.duration); });
scrub.addEventListener('change', () => { scrubbing = false; });
window.addEventListener('pointerup', () => { scrubbing = false; });

document.querySelectorAll('.calib').forEach(c => {
  const side = c.dataset.side;
  c.querySelectorAll('[data-sample]').forEach(b => b.onclick = () => sampleLamp(side, b.dataset.sample));
  const setThr = v => { v = parseFloat(v); if (Number.isFinite(v)) { S.lamps[side].thr = PL.clamp(v, 0, 1); renderLamps(); scheduleSave(); scheduleExtract(); } };
  c.querySelector('.thrRange').addEventListener('input', e => setThr(e.target.value));
  c.querySelector('.thrNum').addEventListener('change', e => setThr(e.target.value));
});

function colourChanged() { scheduleSave(); scheduleRefresh(); if (V.samples.length) toast(t('rescanNeeded'), true); }
document.querySelectorAll('[data-red]').forEach(el => el.addEventListener('change', () => {
  const v = parseFloat(el.value);
  if (Number.isFinite(v)) { S.red[el.dataset.red] = v; colourChanged(); } else el.value = S.red[el.dataset.red];
}));
$('btnRedReset').onclick = () => { S.red = { ...PL.DEFAULT_RED }; syncRedInputs(); colourChanged(); };
document.querySelectorAll('[data-green]').forEach(el => el.addEventListener('change', () => {
  const v = parseFloat(el.value);
  if (Number.isFinite(v)) { S.green[el.dataset.green] = v; colourChanged(); } else el.value = S.green[el.dataset.green];
}));
$('btnGreenReset').onclick = () => { S.green = { ...PL.DEFAULT_GREEN }; syncRedInputs(); colourChanged(); };

// scan settings
function syncScanInputs() {
  document.querySelectorAll('#scanModeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === S.scan.mode));
  $('scanSeekFps').value = S.scan.seekFps; $('scanPlayRate').value = String(S.scan.playRate);
  $('scanSeekFps').disabled = S.scan.mode !== 'seek'; $('scanPlayRate').disabled = S.scan.mode !== 'play';
  $('scanGate').checked = S.scan.gate;
  $('evMergeGap').value = S.scan.mergeGap; $('evMinDur').value = S.scan.minDuration;
}
document.querySelectorAll('#scanModeSeg button').forEach(b => b.onclick = () => { S.scan.mode = b.dataset.mode; syncScanInputs(); scheduleSave(); });
$('scanSeekFps').onchange = e => { const v = parseFloat(e.target.value); if (v > 0 && v <= 60) S.scan.seekFps = v; syncScanInputs(); scheduleSave(); };
$('scanPlayRate').onchange = e => { S.scan.playRate = parseInt(e.target.value, 10); scheduleSave(); };
$('scanGate').onchange = e => { S.scan.gate = e.target.checked; scheduleSave(); scheduleExtract(); };
$('evMergeGap').onchange = e => { const v = parseFloat(e.target.value); if (v >= 0) S.scan.mergeGap = v; syncScanInputs(); scheduleSave(); scheduleExtract(); };
$('evMinDur').onchange = e => { const v = parseFloat(e.target.value); if (v >= 0) S.scan.minDuration = v; syncScanInputs(); scheduleSave(); scheduleExtract(); };
$('btnScan').onclick = startScan;
$('btnScanCancel').onclick = () => { SCAN.cancel = true; REF.cancel = true; };
$('btnClearScan').onclick = async () => {
  if (!V.samples.length) return;
  const ok = await showModal(t('clearScan'), esc(t('clearScanConfirm')),
    [{ label: t('cancel'), value: false }, { label: t('clearScan'), value: true, primary: true }]);
  if (!ok) return;
  V.samples = []; V.dirty = false; V.scanMsg = null; $('scanBar').style.width = '0';
  renderScanInfo(); extractNow();
};
$('evList').addEventListener('click', e => { const r = e.target.closest('.evRow'); if (r) selectEvent(+r.dataset.id); });
window.addEventListener('beforeunload', e => { if (V.dirty && V.samples.length) { e.preventDefault(); e.returnValue = ''; } });

// drag & drop a video onto the stage
const sb = $('stageBox');
sb.addEventListener('dragover', e => { e.preventDefault(); sb.classList.add('dragover'); });
sb.addEventListener('dragleave', () => sb.classList.remove('dragover'));
sb.addEventListener('drop', e => {
  e.preventDefault(); sb.classList.remove('dragover');
  const f = e.dataTransfer.files[0]; if (f && !SCAN.running) openVideoFile(f);
});

function reviewKey(e) {
  const k = e.key;
  if (k >= '1' && k <= '4') rvSetKpi(PL.KPI[+k - 1]);
  else if (k === '0') rvSetKpi(null);
  else if (k === 'ArrowRight') { e.preventDefault(); rvNext(1); }
  else if (k === 'ArrowLeft') { e.preventDefault(); rvNext(-1); }
  else if (k === ' ') { e.preventDefault(); rvToggle(); }
  else if (k === ',') rvStep(-1);
  else if (k === '.') rvStep(1);
  else if (k === '[') rvStep(-(S.fps || 30));
  else if (k === ']') rvStep(S.fps || 30);
  else if (k === 'i' || k === 'I') rvMark('markIn');
  else if (k === 'o' || k === 'O') rvMark('markOut');
  else if (k === 'f' || k === 'F') { $('rvFull').checked = !RV.full; $('rvFull').dispatchEvent(new Event('change')); }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && e.target.closest('input,textarea')) { e.target.blur(); return; }
  if (e.target.closest('input,textarea,select') || !$('modal').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  if (S.view === 'review') return reviewKey(e);
  if (S.view !== 'edit') return;
  const k = e.key;
  if (SCAN.running || REF.running) { if (k === 'Escape') { SCAN.cancel = true; REF.cancel = true; } return; }
  if (k === ' ') { e.preventDefault(); togglePlay(); }
  else if (k === ',') step('-1f');
  else if (k === '.') step('1f');
  else if (k === '[') step('-1s');
  else if (k === ']') step('1s');
  else if (k === 'Escape') { if (drag) endDrag(null, true); armed = false; renderRoiList(); drawOverlay(); }
});

// review controls
document.querySelectorAll('#rvFilterSeg button').forEach(b => b.onclick = () => { S.review.filter = b.dataset.f; scheduleSave(); renderReviewList(); });
$('rvEvents').addEventListener('click', e => { const r = e.target.closest('.rvRow'); if (r) rvSelect(+r.dataset.id); });
$('kpiBtns').addEventListener('click', e => { const b = e.target.closest('.kpiBtn'); if (b) { const l = selEvent() && labelOf(selEvent()); rvSetKpi(l && l.kpi === b.dataset.kpi ? null : b.dataset.kpi); } });
$('rvAuto').onchange = e => { S.review.autoAdvance = e.target.checked; scheduleSave(); };
$('rvPlay').onclick = rvToggle;
document.querySelectorAll('[data-rvstep]').forEach(b => b.onclick = () => rvStep(parseFloat(b.dataset.rvstep)));
$('rvSpeed').onchange = e => { S.review.speed = parseFloat(e.target.value); rvid.playbackRate = S.review.speed; scheduleSave(); };
const winChange = () => {
  const a = parseFloat($('rvPre').value), b = parseFloat($('rvPost').value);
  if (a >= 0 && a <= 30) S.review.pre = a;
  if (b >= 0 && b <= 30) S.review.post = b;
  scheduleSave(); if (RV.sel != null) rvSelect(RV.sel); else renderReviewPanel();
};
$('rvPre').onchange = winChange; $('rvPost').onchange = winChange;
$('rvFull').onchange = e => { RV.full = e.target.checked; if (RV.sel != null) { layoutCrop(); const ev = selEvent(); if (ev) buildStrip(ev, true); } };
$('rvMarkIn').onclick = () => rvMark('markIn');
$('rvMarkOut').onclick = () => rvMark('markOut');
$('rvClearMarks').onclick = () => { const ev = selEvent(), l = ev && labelOf(ev); if (l) { l.markIn = l.markOut = null; scheduleSave(); renderReviewList(); renderReviewPanel(); drawWin(); } };
$('rvFps').addEventListener('change', () => { const ev = selEvent(); if (!ev) return; const lab = ensureLabel(ev); const v = $('rvFps').value.trim();
  if (v === '') lab.fps = null; else commitFps(lab, ev.side); scheduleSave(); renderReviewList(); renderReviewPanel(); });
$('rvFpsGrab').onclick = () => { const ev = selEvent(); if (ev) paintInto($('rvFpsCap'), captureRoi(rvid, S.rois[FPS_ROI[ev.side]], 300)); };
$('rvNote').addEventListener('input', () => { const ev = selEvent(); if (!ev) return; const lab = labelOf(ev);
  if (!lab && !$('rvNote').value) return; ensureLabel(ev).note = $('rvNote').value; scheduleSave(); });
$('rvNote').addEventListener('change', () => renderReviewList());
$('rvUseFrame').onclick = () => {
  const el = S.view === 'review' && rvid.readyState >= 2 ? rvid : vid;
  if (!V.ready) return toast(t('msgNeedVideo'), true);
  $('rvAnchorVideo').value = PL.fmtVideoTime(el.currentTime);
  paintInto($('rvAnchorCap'), captureRoi(el, S.rois.CLOCK, 300));
  $('rvAnchorClock').focus();
};
$('rvAnchorVideo').addEventListener('change', applyAnchorInputs);
$('rvAnchorClock').addEventListener('change', applyAnchorInputs);
$('rvAnchorClear').onclick = () => { const r = reviewStore(false); if (r) { r.anchor = null; scheduleSave(); } renderAnchor(); renderReviewList(); renderReviewPanel(); renderEvents(); };
$('rvAnchorCap').classList.add('empty'); $('rvFpsCap').classList.add('empty');
if ('requestVideoFrameCallback' in rvid) rvid.requestVideoFrameCallback(rvOnFrame);
document.querySelectorAll('.zcal').forEach(c => {
  const side = c.dataset.side;
  c.querySelectorAll('[data-zs]').forEach(b => b.onclick = () => zoneSample(side, b.dataset.zs));
  const setThr = v => { v = parseFloat(v); if (Number.isFinite(v)) { S.zone[side].thr = PL.clamp(v, 0, 1); renderZone(); drawOverlay(); scheduleSave(); scheduleExtract(); } };
  c.querySelector('.thrRange').addEventListener('input', e => setThr(e.target.value));
  c.querySelector('.thrNum').addEventListener('change', e => setThr(e.target.value));
});
for (const [id, k, lo, hi, rescan] of [['zDThr', 'dThr', 1, 255, true], ['zMerge', 'mergeGap', 0, 10], ['zMinDur', 'minDuration', 0, 10], ['zLink', 'linkTol', 0, 10]])
  $(id).onchange = e => { const v = parseFloat(e.target.value); if (Number.isFinite(v) && v >= lo && v <= hi) { S.zone[k] = v; if (rescan) colourChanged(); else scheduleExtract(); scheduleSave(); } renderZone(); scheduleRefresh(); };
$('zShow').onchange = e => { S.zone.show = e.target.checked; scheduleSave(); drawOverlay(); };
$('zRefine').onchange = e => { S.zone.refine = e.target.checked; scheduleSave(); };
$('btnRefine').onclick = () => { if (!V.zoneEvents.length) return toast(t('zoneNoEvents'), true); refineZones(true); };
$('clipFromCur').onclick = () => { if (V.ready) $('clipFrom').value = PL.fmtVideoTime(curTime()); };
$('clipToCur').onclick = () => { if (V.ready) $('clipTo').value = PL.fmtVideoTime(curTime()); };
$('btnClip').onclick = () => {
  const f = PL.parseTime($('clipFrom').value), e = PL.parseTime($('clipTo').value);
  if (Number.isNaN(f) || Number.isNaN(e)) return toast(t('scanBadRange'), true);
  const from = f == null ? curTime() : f, to = e == null ? from + 60 : e;
  saveClip(from, to);
};
$('rvClip').onclick = () => { if (RV.win) saveClip(RV.win[0], RV.win[1]); };
$('rvSugShow').onchange = e => { S.review.suggest = e.target.checked; scheduleSave(); renderSuggestion(); };

// report controls
$('rpCsv').onclick = exportCsv;
$('rpCopy').onclick = copyRows;
$('rpHtml').onclick = exportHtmlReport;
$('rpCancel').onclick = () => { RP.cancel = true; };
$('rpSession').onclick = saveSession;
$('rpLayout').onchange = e => { S.report.layout = e.target.value; scheduleSave(); };
for (const [id, k] of [['rpHeader', 'header'], ['rpNameFirst', 'nameFirst'], ['rpOnlyLabeled', 'onlyLabeled'], ['rpExtras', 'extras']])
  $(id).onchange = e => { S.report[k] = e.target.checked; scheduleSave(); renderReport(); };
$('rpTable').addEventListener('click', e => {
  const tr = e.target.closest('tbody tr'); if (!tr) return;
  const id = +tr.dataset.id;
  setView('review');
  requestAnimationFrame(() => requestAnimationFrame(() => rvSelect(id)));
});

syncRedInputs();
syncScanInputs();
renderKpiButtons();
setView(S.view);
applyI18n();
</script>
</body>
</html>
